<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root {
            --admin-primary: #DC2626;
            --admin-dark: #991B1B;
            --admin-light: #FEE2E2;
            --admin-gradient: linear-gradient(135deg, #DC2626 0%, #991B1B 100%);
            --primary-black: #1A1A1A;
            --secondary-black: #2D2D2D;
            --dark-grey: #404040;
            --medium-grey: #666666;
            --light-grey: #F8F8F8;
            --white: #FFFFFF;
            --green: #22C55E;
            --green-light: #DCFCE7;
            --yellow: #F59E0B;
            --yellow-light: #FEF3C7;

            border-radius: var(--radius-sm);

            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;

        .doc-link:hover {

        .modal-footer {
            padding: 20px 24px;
            border-top: 1px solid #E5E7EB;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            position: sticky;
            bottom: 0;

        }
        
        .btn-modal {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;

            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .btn-modal.cancel {
            background: var(--light-grey);
            color: var(--dark-grey);
        }
        
        .btn-modal.cancel:hover {
            background: #E5E7EB;
        }
        
        .btn-modal.reject {
            background: var(--admin-light);
            color: var(--admin-primary);
        }
        
        .btn-modal.reject:hover {
            background: var(--admin-primary);

        .btn-modal.approve {

        /* Rejection Modal */
        .rejection-form {

<body>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastText">Action completed</span>
    </div>

    <script>
        // Initialize Firebase
        const firebaseConfig = window.firebaseConfig;
        if (!firebaseConfig || !firebaseConfig.apiKey) {
            throw new Error('Missing Firebase configuration');
        }
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentFilter = 'all';
        let allVerifications = [];
        let currentSellerId = null;

        // Auth state listener
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const isAdmin = await checkAdminStatus(user.email);
                if (isAdmin) {
                    await loadVerifications();
                    setupFilters();
                    checkUrlParams();
                    hideLoading();
                } else {
                    window.location.href = '/admin-login.html';
                }
            } else {
                window.location.href = '/admin-login.html';
            }
        });

        // Check admin status
        async function checkAdminStatus(email) {
            try {
                const adminDoc = await db.collection('admins').doc(email).get();
                return adminDoc.exists;
            } catch (error) {
                console.error('Error checking admin status:', error);
                return false;
            }
        }

        // Hide loading
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // Check URL params for specific seller
        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const sellerId = params.get('id');
            if (sellerId) {
                viewSellerDetails(sellerId);
            }
        }

        // Load all verifications
        async function loadVerifications() {
            try {
                const snapshot = await db.collection('sellerVerification')
                    .orderBy('submittedAt', 'desc')
                    .get();
                
                allVerifications = [];
                snapshot.forEach(doc => {
                    allVerifications.push({ id: doc.id, ...doc.data() });
                });
                
                updateCounts();
                renderTable();
                
            } catch (error) {
                console.error('Error loading verifications:', error);
                // If index error, try without orderBy
                if (error.code === 'failed-precondition') {
                    const snapshot = await db.collection('sellerVerification').get();
                    allVerifications = [];
                    snapshot.forEach(doc => {
                        allVerifications.push({ id: doc.id, ...doc.data() });
                    });
                    updateCounts();
                    renderTable();
                }
            }
        }

        // Update counts
        function updateCounts() {
            const pending = allVerifications.filter(v => v.status === 'pending').length;
            const approved = allVerifications.filter(v => v.status === 'approved').length;
            const rejected = allVerifications.filter(v => v.status === 'rejected').length;
            
            document.getElementById('countAll').textContent = allVerifications.length;
            document.getElementById('countPending').textContent = pending;
            document.getElementById('countApproved').textContent = approved;
            document.getElementById('countRejected').textContent = rejected;
            document.getElementById('pendingBadge').textContent = pending;
        }

        // Setup filter buttons
        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.status;
                    renderTable();
                });
            });
        }

        // Render table
        function renderTable() {
            const tbody = document.getElementById('sellersTableBody');
            let filtered = allVerifications;
            
            if (currentFilter !== 'all') {
                filtered = allVerifications.filter(v => v.status === currentFilter);
            }
            
            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fas fa-store"></i>
                                <h3>No ${currentFilter === 'all' ? '' : currentFilter} verifications</h3>
                                <p>No seller verification requests match this filter.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = filtered.map(seller => {
                const initial = (seller.businessName || 'S').charAt(0).toUpperCase();
                const date = seller.submittedAt ? new Date(seller.submittedAt.toDate()).toLocaleDateString() : 'N/A';
                const docs = [];
                if (seller.gstNumber) docs.push('<span class="doc-badge gst">GST</span>');
                if (seller.panNumber) docs.push('<span class="doc-badge pan">PAN</span>');
                if (seller.msmeNumber) docs.push('<span class="doc-badge msme">MSME</span>');
                if (seller.bankAccount) docs.push('<span class="doc-badge bank">Bank</span>');
                
                return `
                    <tr>
                        <td>
                            <div class="seller-info">
                                <div class="seller-avatar">${initial}</div>
                                <div class="seller-details">
                                    <h4>${seller.businessName || 'Unnamed Business'}</h4>
                                    <p>${seller.ownerName || seller.email || 'No contact'}</p>
                                </div>
                            </div>
                        </td>
                        <td>${seller.businessType || 'Not specified'}</td>
                        <td>
                            <div class="doc-badges">
                                ${docs.join('') || '<span style="color: var(--medium-grey); font-size: 0.8rem;">No docs</span>'}
                            </div>
                        </td>
                        <td>
                            <span class="status-badge ${seller.status || 'pending'}">
                                <i class="fas fa-${seller.status === 'approved' ? 'check' : seller.status === 'rejected' ? 'times' : 'clock'}"></i>
                                ${(seller.status || 'pending').charAt(0).toUpperCase() + (seller.status || 'pending').slice(1)}
                            </span>
                        </td>
                        <td>${date}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-sm view" onclick="viewSellerDetails('${seller.id}')">
                                    <i class="fas fa-eye"></i> View
                                </button>
                                ${seller.status === 'pending' ? `
                                    <button class="btn-sm approve" onclick="quickApprove('${seller.id}')">
                                        <i class="fas fa-check"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // View seller details
        function viewSellerDetails(id) {
            currentSellerId = id;
            const seller = allVerifications.find(v => v.id === id);
            if (!seller) return;
            
            document.getElementById('modalBusinessName').textContent = seller.businessName || 'Seller Details';
            
            const date = seller.submittedAt ? new Date(seller.submittedAt.toDate()).toLocaleString() : 'N/A';
            
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-section">
                    <h3><i class="fas fa-building"></i> Business Information</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>Business Name</label>
                            <span>${seller.businessName || 'Not provided'}</span>
                        </div>
                        <div class="detail-item">
                            <label>Business Type</label>
                            <span>${seller.businessType || 'Not specified'}</span>
                        </div>
                        <div class="detail-item">
                            <label>Owner Name</label>
                            <span>${seller.ownerName || 'Not provided'}</span>
                        </div>
                        <div class="detail-item">
                            <label>Phone</label>
                            <span>${seller.phone || 'Not provided'}</span>
                        </div>
                        <div class="detail-item full">
                            <label>Business Address</label>
                            <span>${seller.address || 'Not provided'}</span>
                        </div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h3><i class="fas fa-file-alt"></i> Legal Documents</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>GST Number</label>
                            <span>${seller.gstNumber || 'Not provided'}</span>
                        </div>
                        <div class="detail-item">
                            <label>PAN Number</label>
                            <span>${seller.panNumber || 'Not provided'}</span>
                        </div>
                        <div class="detail-item">
                            <label>MSME/Udyam Number</label>
                            <span>${seller.msmeNumber || 'Not applicable'}</span>
                        </div>
                        <div class="detail-item">
                            <label>Business Category</label>
                            <span>${seller.category || 'Not specified'}</span>
                        </div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h3><i class="fas fa-university"></i> Bank Details</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>Account Holder</label>
                            <span>${seller.bankAccountName || 'Not provided'}</span>
                        </div>
                        <div class="detail-item">
                            <label>Account Number</label>
                            <span>${seller.bankAccount ? '••••' + seller.bankAccount.slice(-4) : 'Not provided'}</span>
                        </div>
                        <div class="detail-item">
                            <label>IFSC Code</label>
                            <span>${seller.ifscCode || 'Not provided'}</span>
                        </div>
                        <div class="detail-item">
                            <label>Bank Name</label>
                            <span>${seller.bankName || 'Not provided'}</span>
                        </div>
                    </div>
                </div>
                
                ${seller.documents && seller.documents.length > 0 ? `
                    <div class="detail-section">
                        <h3><i class="fas fa-paperclip"></i> Uploaded Documents</h3>
                        <div class="document-preview">
                            ${seller.documents.map((doc, i) => `
                                <a href="${doc}" target="_blank" class="doc-link">
                                    <i class="fas fa-file-pdf"></i> Document ${i + 1}
                                </a>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
                
                <div class="detail-section">
                    <h3><i class="fas fa-info-circle"></i> Status & Timeline</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>Current Status</label>
                            <span class="status-badge ${seller.status || 'pending'}" style="margin-top: 4px;">
                                ${(seller.status || 'pending').charAt(0).toUpperCase() + (seller.status || 'pending').slice(1)}
                            </span>
                        </div>
                        <div class="detail-item">
                            <label>Submitted On</label>
                            <span>${date}</span>
                        </div>
                        ${seller.rejectionReason ? `
                            <div class="detail-item full">
                                <label>Rejection Reason</label>
                                <span style="color: var(--admin-primary);">${seller.rejectionReason}</span>
                            </div>
                        ` : ''}
                    </div>
                </div>
                
                <div class="rejection-form" id="rejectionForm" style="display: none;">
                    <h3 style="color: var(--admin-primary); margin-bottom: 12px;">
                        <i class="fas fa-times-circle"></i> Rejection Reason
                    </h3>
                    <textarea id="rejectionReason" placeholder="Please provide a reason for rejection. This will be visible to the seller."></textarea>
                </div>
            `;
            
            // Show/hide action buttons based on status
            const btnApprove = document.getElementById('btnApprove');
            const btnReject = document.getElementById('btnReject');
            
            if (seller.status === 'pending') {
                btnApprove.style.display = 'flex';
                btnReject.style.display = 'flex';
            } else {
                btnApprove.style.display = 'none';
                btnReject.style.display = 'none';
            }
            
            document.getElementById('detailModal').classList.add('show');
        }

        // Close modal
        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
            currentSellerId = null;
            // Reset URL
            window.history.replaceState({}, '', '/admin-sellers.html');
        }

        // Show rejection form
        function showRejectionForm() {
            const form = document.getElementById('rejectionForm');
            if (form.style.display === 'none') {
                form.style.display = 'block';
                document.getElementById('btnReject').innerHTML = '<i class="fas fa-paper-plane"></i> Submit Rejection';
                document.getElementById('btnReject').onclick = rejectSeller;
            } else {
                rejectSeller();
            }
        }

        // Approve seller
        async function approveSeller() {
            if (!currentSellerId) return;
            
            try {
                await db.collection('sellerVerification').doc(currentSellerId).update({
                    status: 'approved',
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    approvedBy: auth.currentUser.email
                });
                
                // Also update user's seller status
                await db.collection('users').doc(currentSellerId).update({
                    sellerVerified: true,
                    sellerApprovedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {});
                
                showToast('Seller approved successfully!', 'success');
                closeModal();
                await loadVerifications();
                
            } catch (error) {
                console.error('Error approving seller:', error);
                showToast('Failed to approve seller', 'error');
            }
        }

        // Reject seller
        async function rejectSeller() {
            if (!currentSellerId) return;
            
            const reason = document.getElementById('rejectionReason').value.trim();
            if (!reason) {
                showToast('Please provide a rejection reason', 'error');
                return;
            }
            
            try {
                await db.collection('sellerVerification').doc(currentSellerId).update({
                    status: 'rejected',
                    rejectionReason: reason,
                    rejectedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    rejectedBy: auth.currentUser.email
                });
                
                showToast('Seller verification rejected', 'success');
                closeModal();
                await loadVerifications();
                
            } catch (error) {
                console.error('Error rejecting seller:', error);
                showToast('Failed to reject seller', 'error');
            }
        }

        // Quick approve from table
        async function quickApprove(id) {
            if (!confirm('Are you sure you want to approve this seller?')) return;
            
            try {
                await db.collection('sellerVerification').doc(id).update({
                    status: 'approved',
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    approvedBy: auth.currentUser.email
                });
                
                await db.collection('users').doc(id).update({
                    sellerVerified: true,
                    sellerApprovedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {});
                
                showToast('Seller approved!', 'success');
                await loadVerifications();
                
            } catch (error) {
                console.error('Error:', error);
                showToast('Failed to approve', 'error');
            }
        }

        // Show toast
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            
            toast.className = `toast ${type}`;
            toastText.textContent = message;
            toast.querySelector('i').className = `fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}`;
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Logout
        async function logout() {
            try {
                await auth.signOut();
                window.location.href = '/admin-login.html';
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        // Close modal on outside click
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') {
                closeModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
