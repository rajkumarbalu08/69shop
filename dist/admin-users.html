<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Admin | 69Shop.in</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="./firebase-config.js"></script>
    
    <style>
        :root {
            --admin-primary: #DC2626;
            --admin-dark: #991B1B;
            --admin-light: #FEE2E2;
            --admin-gradient: linear-gradient(135deg, #DC2626 0%, #991B1B 100%);
            --primary-black: #1A1A1A;
            --secondary-black: #2D2D2D;
            --dark-grey: #404040;
            --medium-grey: #666666;
            --light-grey: #F8F8F8;
            --white: #FFFFFF;
            --green: #22C55E;
            --green-light: #DCFCE7;
            --yellow: #F59E0B;
            --yellow-light: #FEF3C7;
            --blue: #3B82F6;
            --blue-light: #DBEAFE;
            --purple: #7C3AED;
            --purple-light: #EDE9FE;
            --shadow-sm: 0 2px 8px rgba(26, 26, 26, 0.05);
            --shadow-md: 0 4px 16px rgba(26, 26, 26, 0.08);
            --shadow-lg: 0 8px 32px rgba(26, 26, 26, 0.12);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--light-grey);
            min-height: 100vh;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--admin-light);
            border-top-color: var(--admin-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .admin-topbar {
            background: var(--admin-gradient);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-md);
        }
        
        .admin-topbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .admin-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--white);
        }
        
        .admin-logo img {
            width: 36px;
            height: 36px;
        }
        
        .admin-logo-text h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        .admin-logo-text span {
            font-size: 0.7rem;
            opacity: 0.9;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 10px;
        }
        
        .admin-nav {
            display: flex;
            gap: 5px;
        }
        
        .admin-nav a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .admin-nav a:hover,
        .admin-nav a.active {
            background: rgba(255,255,255,0.2);
            color: var(--white);
        }
        
        .admin-nav a .badge {
            background: var(--yellow);
            color: var(--primary-black);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .admin-topbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .btn-logout {
            background: rgba(255,255,255,0.2);
            border: none;
            color: var(--white);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        
        .btn-logout:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .admin-main {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .page-header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.75rem;
            color: var(--primary-black);
        }
        
        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--white);
            padding: 10px 16px;
            border-radius: 25px;
            box-shadow: var(--shadow-sm);
            min-width: 300px;
        }
        
        .search-box input {
            border: none;
            outline: none;
            font-size: 0.9rem;
            flex: 1;
            font-family: inherit;
        }
        
        .search-box i {
            color: var(--medium-grey);
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: var(--white);
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
        
        .stat-icon.blue { background: var(--blue-light); color: var(--blue); }
        .stat-icon.green { background: var(--green-light); color: var(--green); }
        .stat-icon.purple { background: var(--purple-light); color: var(--purple); }
        .stat-icon.yellow { background: var(--yellow-light); color: var(--yellow); }
        
        .stat-content h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-black);
        }
        
        .stat-content p {
            color: var(--medium-grey);
            font-size: 0.85rem;
        }
        
        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #E5E7EB;
            background: var(--white);
            border-radius: 25px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-btn:hover {
            border-color: var(--admin-primary);
            color: var(--admin-primary);
        }
        
        .filter-btn.active {
            background: var(--admin-primary);
            border-color: var(--admin-primary);
            color: var(--white);
        }
        
        .filter-btn .count {
            background: rgba(0,0,0,0.1);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }
        
        .filter-btn.active .count {
            background: rgba(255,255,255,0.3);
        }
        
        .users-card {
            background: var(--white);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        
        .users-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .users-table th,
        .users-table td {
            padding: 16px 20px;
            text-align: left;
        }
        
        .users-table th {
            background: var(--light-grey);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--medium-grey);
            border-bottom: 1px solid #E5E7EB;
        }
        
        .users-table tr {
            border-bottom: 1px solid #F3F4F6;
            transition: background 0.2s;
        }
        
        .users-table tbody tr:hover {
            background: var(--light-grey);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
        }
        
        .user-avatar.buyer {
            background: var(--blue-light);
            color: var(--blue);
        }
        
        .user-avatar.seller {
            background: var(--purple-light);
            color: var(--purple);
        }
        
        .user-details h4 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary-black);
            margin-bottom: 2px;
        }
        
        .user-details p {
            font-size: 0.8rem;
            color: var(--medium-grey);
        }
        
        .type-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .type-badge.buyer {
            background: var(--blue-light);
            color: var(--blue);
        }
        
        .type-badge.seller {
            background: var(--purple-light);
            color: var(--purple);
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .status-badge.active {
            background: var(--green-light);
            color: #166534;
        }
        
        .status-badge.inactive {
            background: var(--admin-light);
            color: var(--admin-dark);
        }
        
        .action-btns {
            display: flex;
            gap: 8px;
        }
        
        .btn-sm {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-sm.view {
            background: var(--blue-light);
            color: var(--blue);
        }
        
        .btn-sm.view:hover {
            background: var(--blue);
            color: var(--white);
        }
        
        .btn-sm.disable {
            background: var(--admin-light);
            color: var(--admin-primary);
        }
        
        .btn-sm.disable:hover {
            background: var(--admin-primary);
            color: var(--white);
        }
        
        .btn-sm.enable {
            background: var(--green-light);
            color: var(--green);
        }
        
        .btn-sm.enable:hover {
            background: var(--green);
            color: var(--white);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--medium-grey);
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: var(--dark-grey);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            background: var(--white);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }
        
        .modal-header {
            padding: 24px;
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .modal-header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.25rem;
            color: var(--primary-black);
        }
        
        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--light-grey);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: var(--admin-light);
            color: var(--admin-primary);
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .detail-item {
            margin-bottom: 16px;
            padding: 12px;
            background: var(--light-grey);
            border-radius: var(--radius-sm);
        }
        
        .detail-item label {
            display: block;
            font-size: 0.75rem;
            color: var(--medium-grey);
            margin-bottom: 4px;
        }
        
        .detail-item span {
            font-weight: 500;
            color: var(--primary-black);
        }
        
        .modal-footer {
            padding: 20px 24px;
            border-top: 1px solid #E5E7EB;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        .btn-modal {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        
        .btn-modal.cancel {
            background: var(--light-grey);
            color: var(--dark-grey);
        }
        
        .btn-modal.cancel:hover {
            background: #E5E7EB;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 16px 24px;
            border-radius: var(--radius-sm);
            color: var(--white);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 3000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }
        
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .toast.success { background: var(--green); }
        .toast.error { background: var(--admin-primary); }
        
        @media (max-width: 1024px) {
            .users-table {
                display: block;
                overflow-x: auto;
            }
        }
        
        @media (max-width: 768px) {
            .admin-nav {
                display: none;
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .search-box {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <nav class="admin-topbar">
        <div class="admin-topbar-left">
            <a href="/admin-dashboard.html" class="admin-logo">
                <img src="/Logo/69shopc.png" alt="69Shop.in" onerror="this.style.display='none'">
                <div class="admin-logo-text">
                    <h1>69Shop.in</h1>
                    <span>Admin Portal</span>
                </div>
            </a>
            
            <div class="admin-nav">
                <a href="/admin-dashboard.html">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="/admin-sellers.html">
                    <i class="fas fa-store"></i> Sellers
                </a>
                <a href="/admin-users.html" class="active">
                    <i class="fas fa-users"></i> Users
                </a>
                <a href="/admin-products.html">
                    <i class="fas fa-box"></i> Products
                </a>
            </div>
        </div>
        
        <div class="admin-topbar-right">
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <main class="admin-main">
        <div class="page-header">
            <h1><i class="fas fa-users"></i> User Management</h1>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search by name or email...">
            </div>
        </div>
        
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-content">
                    <h3 id="totalUsers">0</h3>
                    <p>Total Users</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <div class="stat-content">
                    <h3 id="totalBuyers">0</h3>
                    <p>Buyers</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">
                    <i class="fas fa-store"></i>
                </div>
                <div class="stat-content">
                    <h3 id="totalSellers">0</h3>
                    <p>Sellers</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon yellow">
                    <i class="fas fa-user-check"></i>
                </div>
                <div class="stat-content">
                    <h3 id="activeUsers">0</h3>
                    <p>Active Today</p>
                </div>
            </div>
        </div>
        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">
                All <span class="count" id="countAll">0</span>
            </button>
            <button class="filter-btn" data-filter="buyer">
                <i class="fas fa-shopping-bag"></i> Buyers <span class="count" id="countBuyers">0</span>
            </button>
            <button class="filter-btn" data-filter="seller">
                <i class="fas fa-store"></i> Sellers <span class="count" id="countSellers">0</span>
            </button>
        </div>
        
        <div class="users-card">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <i class="fas fa-users"></i>
                                <h3>No Users Found</h3>
                                <p>Users will appear here once they register.</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- User Detail Modal -->
    <div class="modal-overlay" id="userModal">
        <div class="modal">
            <div class="modal-header">
                <h2><i class="fas fa-user"></i> <span id="modalUserName">User Details</span></h2>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic content -->
            </div>
            <div class="modal-footer">
                <button class="btn-modal cancel" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastText">Action completed</span>
    </div>

    <script>
        // Initialize Firebase
        const firebaseConfig = window.firebaseConfig;
        if (!firebaseConfig || !firebaseConfig.apiKey) {
            throw new Error('Missing Firebase configuration');
        }
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentFilter = 'all';
        let allUsers = [];
        let searchQuery = '';

        // Auth state listener
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const isAdmin = await checkAdminStatus(user.email);
                if (isAdmin) {
                    await loadUsers();
                    setupEventListeners();
                    hideLoading();
                } else {
                    window.location.href = '/admin-login.html';
                }
            } else {
                window.location.href = '/admin-login.html';
            }
        });

        async function checkAdminStatus(email) {
            try {
                const adminDoc = await db.collection('admins').doc(email).get();
                return adminDoc.exists;
            } catch (error) {
                console.error('Error checking admin status:', error);
                return false;
            }
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        async function loadUsers() {
            try {
                const snapshot = await db.collection('users').get();
                
                allUsers = [];
                snapshot.forEach(doc => {
                    allUsers.push({ id: doc.id, ...doc.data() });
                });
                
                updateStats();
                renderTable();
                
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        function updateStats() {
            const buyers = allUsers.filter(u => u.userType === 'buyer' || !u.userType);
            const sellers = allUsers.filter(u => u.userType === 'seller');
            const active = allUsers.filter(u => u.status !== 'disabled');
            
            document.getElementById('totalUsers').textContent = allUsers.length;
            document.getElementById('totalBuyers').textContent = buyers.length;
            document.getElementById('totalSellers').textContent = sellers.length;
            document.getElementById('activeUsers').textContent = active.length;
            
            document.getElementById('countAll').textContent = allUsers.length;
            document.getElementById('countBuyers').textContent = buyers.length;
            document.getElementById('countSellers').textContent = sellers.length;
        }

        function setupEventListeners() {
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderTable();
                });
            });
            
            // Search
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderTable();
            });
        }

        function renderTable() {
            const tbody = document.getElementById('usersTableBody');
            let filtered = allUsers;
            
            // Apply filter
            if (currentFilter === 'buyer') {
                filtered = allUsers.filter(u => u.userType === 'buyer' || !u.userType);
            } else if (currentFilter === 'seller') {
                filtered = allUsers.filter(u => u.userType === 'seller');
            }
            
            // Apply search
            if (searchQuery) {
                filtered = filtered.filter(u => 
                    (u.name && u.name.toLowerCase().includes(searchQuery)) ||
                    (u.email && u.email.toLowerCase().includes(searchQuery))
                );
            }
            
            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <i class="fas fa-users"></i>
                                <h3>No Users Found</h3>
                                <p>No users match your current filters.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = filtered.map(user => {
                const initial = (user.name || user.email || 'U').charAt(0).toUpperCase();
                const userType = user.userType || 'buyer';
                const isDisabled = user.status === 'disabled';
                const joinDate = user.createdAt ? new Date(user.createdAt.toDate()).toLocaleDateString() : 'Unknown';
                
                return `
                    <tr>
                        <td>
                            <div class="user-info">
                                <div class="user-avatar ${userType}">${initial}</div>
                                <div class="user-details">
                                    <h4>${user.name || 'Unknown'}</h4>
                                    <p>${user.email || 'No email'}</p>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="type-badge ${userType}">
                                <i class="fas fa-${userType === 'seller' ? 'store' : 'shopping-bag'}"></i>
                                ${userType.charAt(0).toUpperCase() + userType.slice(1)}
                            </span>
                        </td>
                        <td>
                            <span class="status-badge ${isDisabled ? 'inactive' : 'active'}">
                                ${isDisabled ? 'Disabled' : 'Active'}
                            </span>
                        </td>
                        <td>${joinDate}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-sm view" onclick="viewUser('${user.id}')">
                                    <i class="fas fa-eye"></i> View
                                </button>
                                ${isDisabled ? `
                                    <button class="btn-sm enable" onclick="toggleUserStatus('${user.id}', false)">
                                        <i class="fas fa-check"></i> Enable
                                    </button>
                                ` : `
                                    <button class="btn-sm disable" onclick="toggleUserStatus('${user.id}', true)">
                                        <i class="fas fa-ban"></i> Disable
                                    </button>
                                `}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function viewUser(id) {
            const user = allUsers.find(u => u.id === id);
            if (!user) return;
            
            document.getElementById('modalUserName').textContent = user.name || 'User Details';
            
            const joinDate = user.createdAt ? new Date(user.createdAt.toDate()).toLocaleString() : 'Unknown';
            const lastLogin = user.lastLogin ? new Date(user.lastLogin.toDate()).toLocaleString() : 'Never';
            
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-item">
                    <label>Full Name</label>
                    <span>${user.name || 'Not provided'}</span>
                </div>
                <div class="detail-item">
                    <label>Email</label>
                    <span>${user.email || 'Not provided'}</span>
                </div>
                <div class="detail-item">
                    <label>Phone</label>
                    <span>${user.phone || 'Not provided'}</span>
                </div>
                <div class="detail-item">
                    <label>Account Type</label>
                    <span>${(user.userType || 'buyer').charAt(0).toUpperCase() + (user.userType || 'buyer').slice(1)}</span>
                </div>
                <div class="detail-item">
                    <label>Status</label>
                    <span>${user.status === 'disabled' ? 'Disabled' : 'Active'}</span>
                </div>
                <div class="detail-item">
                    <label>Joined</label>
                    <span>${joinDate}</span>
                </div>
                <div class="detail-item">
                    <label>Last Login</label>
                    <span>${lastLogin}</span>
                </div>
                ${user.userType === 'seller' ? `
                    <div class="detail-item">
                        <label>Seller Verified</label>
                        <span>${user.sellerVerified ? 'Yes ✓' : 'No'}</span>
                    </div>
                ` : ''}
            `;
            
            document.getElementById('userModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('show');
        }

        async function toggleUserStatus(id, disable) {
            const action = disable ? 'disable' : 'enable';
            if (!confirm(`Are you sure you want to ${action} this user?`)) return;
            
            try {
                await db.collection('users').doc(id).update({
                    status: disable ? 'disabled' : 'active',
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedBy: auth.currentUser.email
                });
                
                showToast(`User ${action}d successfully!`, 'success');
                await loadUsers();
                
            } catch (error) {
                console.error('Error updating user:', error);
                showToast('Failed to update user', 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            
            toast.className = `toast ${type}`;
            toastText.textContent = message;
            toast.querySelector('i').className = `fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}`;
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function logout() {
            try {
                await auth.signOut();
                window.location.href = '/admin-login.html';
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        // Close modal on outside click
        document.getElementById('userModal').addEventListener('click', (e) => {
            if (e.target.id === 'userModal') {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
