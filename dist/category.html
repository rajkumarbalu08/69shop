<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Shop Category - 69Shop.in</title>
    <meta name="description" id="pageDescription" content="Shop quality products on 69Shop.in - India's premium marketplace">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Product Data -->
    <script src="products-data.js"></script>
    
    <!-- Reusable Components -->
    <script src="/js/components/header.js"></script>
    <script src="/js/components/footer.js"></script>
    <script src="/js/components/product-card.js"></script>
    <script src="/js/components/cart-drawer.js"></script>
    
    <style>
        :root {
            --primary-black: #1A1A1A;
            --secondary-black: #2D2D2D;
            --dark-grey: #404040;
            --medium-grey: #666666;
            --light-grey: #F8F8F8;
            --white: #FFFFFF;
            --blue-primary: #0066ff;
            --blue-light: #E6F2FF;
            --blue-dark: #0047B3;
            --accent-blue: #009cf7;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --gradient-premium: linear-gradient(135deg, var(--blue-primary) 0%, var(--accent-blue) 100%);
            --shadow-sm: 0 2px 8px rgba(26, 26, 26, 0.05);
            --shadow-md: 0 4px 16px rgba(26, 26, 26, 0.08);
            --shadow-lg: 0 8px 32px rgba(26, 26, 26, 0.12);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--primary-black);
            background-color: var(--light-grey);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Category Hero */
        .category-hero {
            background: var(--gradient-premium);
            padding: 48px 0;
            text-align: center;
            color: var(--white);
            position: relative;
            overflow: hidden;
        }

        .category-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }

        .category-hero-content {
            position: relative;
            z-index: 1;
        }

        .category-hero h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .category-hero h1 i {
            font-size: 2rem;
            opacity: 0.9;
        }

        .category-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        .category-breadcrumb {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .category-breadcrumb a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
        }

        .category-breadcrumb a:hover {
            color: #fff;
        }

        .category-breadcrumb span {
            opacity: 0.6;
        }

        /* Main Content */
        .category-main {
            flex: 1;
            padding: 32px 0;
        }

        /* Toolbar */
        .category-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .product-count {
            font-size: 0.9rem;
            color: var(--medium-grey);
        }

        .product-count strong {
            color: var(--primary-black);
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--white);
            border: 1px solid #e0e0e0;
            border-radius: var(--radius-md);
            padding: 8px 16px;
            gap: 8px;
            min-width: 280px;
        }

        .search-box input {
            border: none;
            outline: none;
            font-size: 0.9rem;
            width: 100%;
            background: transparent;
        }

        .search-box i {
            color: var(--medium-grey);
        }

        .sort-select {
            padding: 10px 16px;
            border: 1px solid #e0e0e0;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            background: var(--white);
            cursor: pointer;
        }

        .view-toggle {
            display: flex;
            gap: 4px;
            background: var(--white);
            border-radius: var(--radius-md);
            padding: 4px;
            border: 1px solid #e0e0e0;
        }

        .view-toggle button {
            padding: 8px 12px;
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--medium-grey);
            transition: var(--transition);
        }

        .view-toggle button.active {
            background: var(--blue-primary);
            color: var(--white);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .products-grid.list-view {
            grid-template-columns: 1fr;
        }

        .products-grid.list-view .product-card {
            flex-direction: row;
            max-width: 100%;
        }

        .products-grid.list-view .product-image-wrapper {
            width: 200px;
            flex-shrink: 0;
        }

        /* Loading State */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 16px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--light-grey);
            border-top-color: var(--blue-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Subcategory Chips */
        .subcategory-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .subcategory-chip {
            padding: 8px 16px;
            background: var(--white);
            border: 1px solid #e0e0e0;
            border-radius: 999px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .subcategory-chip:hover {
            border-color: var(--blue-primary);
            color: var(--blue-primary);
        }

        .subcategory-chip.active {
            background: var(--blue-primary);
            color: var(--white);
            border-color: var(--blue-primary);
        }

        /* Pagination */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 40px;
            padding: 20px 0;
        }

        .pagination button {
            padding: 10px 16px;
            border: 1px solid #e0e0e0;
            background: var(--white);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }

        .pagination button:hover:not(:disabled) {
            border-color: var(--blue-primary);
            color: var(--blue-primary);
        }

        .pagination button.active {
            background: var(--blue-primary);
            color: var(--white);
            border-color: var(--blue-primary);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Back to Shop Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--medium-grey);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 16px;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--blue-primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .category-hero {
                padding: 32px 0;
            }

            .category-hero h1 {
                font-size: 1.75rem;
            }

            .category-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-left, .toolbar-right {
                justify-content: space-between;
            }

            .search-box {
                min-width: auto;
                flex: 1;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }

        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: 1fr;
            }

            .view-toggle {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Reusable Header -->
    <div id="shop-header"></div>

    <!-- Reusable Cart Drawer -->
    <div id="cart-drawer"></div>

    <!-- Category Hero -->
    <section class="category-hero" id="categoryHero">
        <div class="container">
            <div class="category-hero-content">
                <nav class="category-breadcrumb">
                    <a href="/">Home</a>
                    <span>/</span>
                    <a href="/shop.html">Shop</a>
                    <span>/</span>
                    <span id="breadcrumbCategory">Category</span>
                </nav>
                <h1>
                    <i class="fas fa-box" id="categoryIcon"></i>
                    <span id="categoryTitle">Category</span>
                </h1>
                <p id="categoryDescription">Explore our collection of quality products</p>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="category-main">
        <div class="container">
            <a href="/shop.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to all products
            </a>

            <!-- Subcategory Chips -->
            <div class="subcategory-chips" id="subcategoryChips"></div>

            <!-- Toolbar -->
            <div class="category-toolbar">
                <div class="toolbar-left">
                    <div class="product-count">
                        <strong id="productCountNum">0</strong> products found
                    </div>
                </div>
                <div class="toolbar-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search in this category...">
                    </div>
                    <select class="sort-select" id="sortSelect">
                        <option value="featured">Featured</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Highest Rated</option>
                        <option value="newest">Newest First</option>
                    </select>
                    <div class="view-toggle">
                        <button class="active" id="gridViewBtn" aria-label="Grid view">
                            <i class="fas fa-th"></i>
                        </button>
                        <button id="listViewBtn" aria-label="List view">
                            <i class="fas fa-list"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="products-grid" id="productsGrid">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Loading products...</p>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination"></div>
        </div>
    </main>

    <!-- Reusable Footer -->
    <div id="shop-footer"></div>

    <script>
        // =============================================
        // CATEGORY CONFIGURATION
        // =============================================
        const CATEGORY_CONFIG = {
            'mobiles': {
                title: 'Mobiles',
                icon: 'fa-mobile-alt',
                description: 'Latest smartphones and budget-friendly picks',
                keywords: ['mobile', 'phone', 'smartphone', 'android', 'iphone'],
                subcategories: ['All', 'Smartphones', 'Feature Phones', 'Accessories', 'Cases']
            },
            'electronics': {
                title: 'Electronics',
                icon: 'fa-laptop',
                description: 'Laptops, tablets, TVs and gaming consoles',
                keywords: ['electronics', 'laptop', 'tablet', 'tv', 'computer', 'gaming'],
                subcategories: ['All', 'Laptops', 'Tablets', 'TVs', 'Gaming', 'Cameras']
            },
            'fashion': {
                title: 'Fashion',
                icon: 'fa-tshirt',
                description: 'Clothing, footwear, watches and accessories',
                keywords: ['fashion', 'clothing', 'shoes', 'watch', 'accessories', 'apparel'],
                subcategories: ['All', 'Men', 'Women', 'Kids', 'Shoes', 'Watches', 'Accessories']
            },
            'beauty': {
                title: 'Beauty',
                icon: 'fa-spa',
                description: 'Skincare, haircare and cosmetics',
                keywords: ['beauty', 'skincare', 'makeup', 'cosmetics', 'haircare'],
                subcategories: ['All', 'Skincare', 'Makeup', 'Haircare', 'Fragrances', 'Men\'s Grooming']
            },
            'appliances': {
                title: 'Appliances',
                icon: 'fa-blender',
                description: 'Smart home and kitchen essentials',
                keywords: ['appliances', 'kitchen', 'home', 'smart', 'refrigerator'],
                subcategories: ['All', 'Kitchen', 'Laundry', 'Cooling', 'Small Appliances']
            },
            'headphones': {
                title: 'Headphones',
                icon: 'fa-headphones',
                description: 'ANC, over-ear, and sport buds',
                keywords: ['headphones', 'earphones', 'audio', 'earbuds', 'wireless'],
                subcategories: ['All', 'Over-Ear', 'In-Ear', 'TWS', 'Gaming', 'Sports']
            },
            'home-needs': {
                title: 'Home Needs',
                icon: 'fa-home',
                description: 'Lighting, comfort, and daily essentials',
                keywords: ['home', 'living', 'decor', 'furniture', 'lighting'],
                subcategories: ['All', 'Lighting', 'Bedding', 'Storage', 'Decor', 'Kitchen']
            },
            'books': {
                title: 'Books',
                icon: 'fa-book',
                description: 'Books, notebooks and stationery',
                keywords: ['books', 'novels', 'stationery', 'reading'],
                subcategories: ['All', 'Fiction', 'Non-Fiction', 'Academic', 'Children', 'Stationery']
            },
            'sports': {
                title: 'Sports',
                icon: 'fa-running',
                description: 'Sports gear, fitness equipment and activewear',
                keywords: ['sports', 'fitness', 'gym', 'outdoor', 'activewear'],
                subcategories: ['All', 'Fitness', 'Outdoor', 'Team Sports', 'Activewear', 'Equipment']
            },
            'grocery': {
                title: 'Grocery',
                icon: 'fa-shopping-basket',
                description: 'Groceries, beverages and gourmet foods',
                keywords: ['grocery', 'food', 'beverages', 'snacks', 'organic'],
                subcategories: ['All', 'Staples', 'Snacks', 'Beverages', 'Organic', 'Gourmet']
            }
        };

        // State
        let currentCategory = 'all';
        let currentSubcategory = 'All';
        let allProducts = [];
        let filteredProducts = [];
        let currentPage = 1;
        const productsPerPage = 12;
        let searchTerm = '';
        let sortBy = 'featured';
        let viewMode = 'grid';

        // =============================================
        // INITIALIZATION
        // =============================================
        document.addEventListener('DOMContentLoaded', () => {
            // Detect category from URL
            detectCategory();
            
            // Initialize components
            initComponents();
            
            // Load products
            loadProducts();
            
            // Setup event listeners
            setupEventListeners();
        });

        function detectCategory() {
            // Check URL path (e.g., /category.html or /category/mobiles)
            const path = window.location.pathname;
            const urlParams = new URLSearchParams(window.location.search);
            
            // Try to get category from query param first
            let category = urlParams.get('category') || urlParams.get('cat');
            
            if (!category) {
                // Try to extract from filename
                const filename = path.split('/').pop().replace('.html', '');
                if (CATEGORY_CONFIG[filename]) {
                    category = filename;
                }
            }
            
            if (!category) {
                // Try to extract from path segment
                const segments = path.split('/').filter(s => s);
                for (const seg of segments) {
                    const clean = seg.replace('.html', '').toLowerCase();
                    if (CATEGORY_CONFIG[clean]) {
                        category = clean;
                        break;
                    }
                }
            }
            
            currentCategory = category || 'all';
            updateCategoryUI();
        }

        function updateCategoryUI() {
            const config = CATEGORY_CONFIG[currentCategory] || {
                title: 'All Products',
                icon: 'fa-store',
                description: 'Browse our complete collection',
                subcategories: ['All']
            };
            
            // Update page title and meta
            document.getElementById('pageTitle').textContent = `${config.title} - 69Shop.in`;
            document.getElementById('pageDescription').setAttribute('content', config.description);
            
            // Update hero
            document.getElementById('categoryTitle').textContent = config.title;
            document.getElementById('categoryIcon').className = `fas ${config.icon}`;
            document.getElementById('categoryDescription').textContent = config.description;
            document.getElementById('breadcrumbCategory').textContent = config.title;
            
            // Update subcategory chips
            renderSubcategories(config.subcategories || ['All']);
        }

        function renderSubcategories(subcategories) {
            const container = document.getElementById('subcategoryChips');
            container.innerHTML = subcategories.map(sub => `
                <button class="subcategory-chip ${sub === currentSubcategory ? 'active' : ''}" 
                        data-subcategory="${sub}">
                    ${sub}
                </button>
            `).join('');
            
            container.querySelectorAll('.subcategory-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    currentSubcategory = chip.dataset.subcategory;
                    container.querySelectorAll('.subcategory-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    filterAndRender();
                });
            });
        }

        function initComponents() {
            // Initialize header
            ShopHeader.init({
                containerId: 'shop-header',
                onCartClick: () => CartDrawer.open(),
                onProfileClick: () => window.location.href = '/profile.html',
                onSearchSubmit: (term) => {
                    window.location.href = `/shop.html?search=${encodeURIComponent(term)}`;
                },
                onLogoClick: () => window.location.href = '/'
            });
            
            // Initialize cart drawer
            CartDrawer.init({
                containerId: 'cart-drawer',
                enableGuestCheckout: true,
                onCheckout: (cart, total) => {
                    // Redirect to shop checkout
                    window.location.href = '/shop.html#checkout';
                }
            });
            
            // Initialize footer
            ShopFooter.init({
                containerId: 'shop-footer'
            });
        }

        function loadProducts() {
            // Load from products-data.js
            if (window.productsData && Array.isArray(window.productsData)) {
                allProducts = [...window.productsData];
            } else {
                allProducts = [];
            }
            
            filterAndRender();
        }

        function filterAndRender() {
            const config = CATEGORY_CONFIG[currentCategory];
            
            // Filter by category
            if (currentCategory !== 'all' && config) {
                filteredProducts = allProducts.filter(p => {
                    const cat = (p.category || '').toLowerCase();
                    const name = (p.name || '').toLowerCase();
                    const desc = (p.description || '').toLowerCase();
                    
                    // Check if matches category title or keywords
                    if (cat === config.title.toLowerCase()) return true;
                    if (cat.includes(currentCategory)) return true;
                    
                    for (const keyword of (config.keywords || [])) {
                        if (cat.includes(keyword) || name.includes(keyword)) return true;
                    }
                    
                    return false;
                });
            } else {
                filteredProducts = [...allProducts];
            }
            
            // Filter by subcategory
            if (currentSubcategory && currentSubcategory !== 'All') {
                const subLower = currentSubcategory.toLowerCase();
                filteredProducts = filteredProducts.filter(p => {
                    const cat = (p.category || '').toLowerCase();
                    const subcat = (p.subcategory || '').toLowerCase();
                    const name = (p.name || '').toLowerCase();
                    return cat.includes(subLower) || subcat.includes(subLower) || name.includes(subLower);
                });
            }
            
            // Filter by search
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filteredProducts = filteredProducts.filter(p => 
                    (p.name || '').toLowerCase().includes(term) ||
                    (p.description || '').toLowerCase().includes(term) ||
                    (p.category || '').toLowerCase().includes(term)
                );
            }
            
            // Sort
            sortProducts();
            
            // Update count
            document.getElementById('productCountNum').textContent = filteredProducts.length;
            
            // Render
            renderProducts();
            renderPagination();
        }

        function sortProducts() {
            switch (sortBy) {
                case 'price-low':
                    filteredProducts.sort((a, b) => (a.price || 0) - (b.price || 0));
                    break;
                case 'price-high':
                    filteredProducts.sort((a, b) => (b.price || 0) - (a.price || 0));
                    break;
                case 'rating':
                    filteredProducts.sort((a, b) => (b.rating || 0) - (a.rating || 0));
                    break;
                case 'newest':
                    filteredProducts.sort((a, b) => (b.id || 0) - (a.id || 0));
                    break;
                default:
                    // Featured - keep original order or sort by featured flag
                    filteredProducts.sort((a, b) => {
                        if (a.featured && !b.featured) return -1;
                        if (!a.featured && b.featured) return 1;
                        return 0;
                    });
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            
            // Calculate pagination
            const start = (currentPage - 1) * productsPerPage;
            const end = start + productsPerPage;
            const pageProducts = filteredProducts.slice(start, end);
            
            if (pageProducts.length === 0) {
                grid.innerHTML = `
                    <div class="empty-products" style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
                        <i class="fas fa-box-open" style="font-size: 3rem; color: #ccc; margin-bottom: 16px; display: block;"></i>
                        <h3 style="font-size: 1.25rem; color: #333; margin-bottom: 8px;">No products found</h3>
                        <p style="color: #666;">Try adjusting your filters or search term</p>
                    </div>
                `;
                return;
            }
            
            // Use ProductCard component
            ProductCard.createGrid(pageProducts, 'productsGrid', {
                showWishlist: true,
                showQuickView: false,
                lazyLoad: true,
                onAddToCart: (product) => {
                    CartDrawer.addItem(product);
                },
                onWishlistToggle: (product, added) => {
                    // Already handled by ProductCard
                }
            });
            
            // Apply view mode
            grid.classList.toggle('list-view', viewMode === 'list');
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredProducts.length / productsPerPage);
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let html = '';
            
            // Previous button
            html += `<button ${currentPage === 1 ? 'disabled' : ''} data-page="${currentPage - 1}">
                <i class="fas fa-chevron-left"></i>
            </button>`;
            
            // Page numbers
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            
            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }
            
            if (startPage > 1) {
                html += `<button data-page="1">1</button>`;
                if (startPage > 2) html += `<span>...</span>`;
            }
            
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span>...</span>`;
                html += `<button data-page="${totalPages}">${totalPages}</button>`;
            }
            
            // Next button
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">
                <i class="fas fa-chevron-right"></i>
            </button>`;
            
            container.innerHTML = html;
            
            container.querySelectorAll('button[data-page]').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPage = parseInt(btn.dataset.page);
                    renderProducts();
                    renderPagination();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }

        function setupEventListeners() {
            // Search
            const searchInput = document.getElementById('searchInput');
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchTerm = e.target.value.trim();
                    currentPage = 1;
                    filterAndRender();
                }, 300);
            });
            
            // Sort
            document.getElementById('sortSelect').addEventListener('change', (e) => {
                sortBy = e.target.value;
                currentPage = 1;
                filterAndRender();
            });
            
            // View toggle
            document.getElementById('gridViewBtn').addEventListener('click', () => {
                viewMode = 'grid';
                document.getElementById('gridViewBtn').classList.add('active');
                document.getElementById('listViewBtn').classList.remove('active');
                document.getElementById('productsGrid').classList.remove('list-view');
            });
            
            document.getElementById('listViewBtn').addEventListener('click', () => {
                viewMode = 'list';
                document.getElementById('listViewBtn').classList.add('active');
                document.getElementById('gridViewBtn').classList.remove('active');
                document.getElementById('productsGrid').classList.add('list-view');
            });
        }
    </script>
</body>
</html>
