<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - 69Shop.in</title>
    <meta name="description" content="View product details on 69Shop.in - India's premium marketplace">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="./firebase-config.js"></script>
    <script src="products-data.js"></script>
    
    <script>
        let auth = null;
        let db = null;
        let firebaseReady = false;
        try {
            const firebaseConfig = window.firebaseConfig;
            if (!firebaseConfig || !firebaseConfig.apiKey) {
                console.warn('Firebase configuration missing.');
            } else {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                auth = firebase.auth();
                db = firebase.firestore();
                firebaseReady = true;
            }
        } catch (error) {
            console.warn('Firebase failed to initialize.', error);
        }
        window.firebaseReady = firebaseReady;
    </script>

    <style>
        :root {
            --primary-black: #1A1A1A;
            --secondary-black: #2D2D2D;
            --dark-grey: #404040;
            --medium-grey: #666666;
            --light-grey: #F8F8F8;
            --white: #FFFFFF;
            --blue-primary: #0066ff;
            --blue-light: #E6F2FF;
            --blue-dark: #0047B3;
            --accent-blue: #009cf7;
            --text-dark: #1A1A1A;
            --text-medium: #404040;
            --text-light: #666666;
            --text-white: #FFFFFF;
            --gradient-premium: linear-gradient(135deg, var(--blue-primary) 0%, var(--accent-blue) 100%);
            --shadow-sm: 0 2px 8px rgba(26, 26, 26, 0.05);
            --shadow-md: 0 4px 16px rgba(26, 26, 26, 0.08);
            --shadow-lg: 0 8px 32px rgba(26, 26, 26, 0.12);
            --shadow-xl: 0 12px 48px rgba(26, 26, 26, 0.15);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition-fast: all 0.2s ease;
            --transition-normal: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background-color: var(--light-grey);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            background: var(--primary-black);
            box-shadow: var(--shadow-md);
            z-index: 1000;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 45px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-text .site-name {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--blue-primary);
            font-family: 'Poppins', sans-serif;
        }

        .logo-text .tagline {
            font-size: 0.7rem;
            color: var(--text-white);
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-white);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .cart-btn {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--blue-primary);
            color: white;
            font-size: 0.7rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* Breadcrumb */
        .breadcrumb {
            padding: 16px 0;
            background: var(--white);
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        .breadcrumb-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .breadcrumb-nav a {
            color: var(--blue-primary);
            text-decoration: none;
        }

        .breadcrumb-nav a:hover {
            text-decoration: underline;
        }

        /* Product Page Layout */
        .product-page {
            padding: 40px 0 80px;
        }

        .product-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 40px;
            box-shadow: var(--shadow-md);
        }

        /* Image Gallery */
        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .main-image-container {
            position: relative;
            aspect-ratio: 1;
            background: var(--light-grey);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.4s ease;
        }

        .main-image-container:hover .main-image {
            transform: scale(1.05);
        }

        .image-zoom-hint {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .thumbnail-strip {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 4px 0;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition-fast);
            flex-shrink: 0;
        }

        .thumbnail:hover {
            border-color: var(--blue-primary);
            opacity: 0.8;
        }

        .thumbnail.active {
            border-color: var(--blue-primary);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.2);
        }

        /* Product Info */
        .product-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .product-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-new {
            background: linear-gradient(135deg, #00c853 0%, #69f0ae 100%);
            color: #fff;
        }

        .badge-discount {
            background: linear-gradient(135deg, #ff5252 0%, #ff8a80 100%);
            color: #fff;
        }

        .badge-premium {
            background: linear-gradient(135deg, #ffd700 0%, #ffab00 100%);
            color: #1a1a1a;
        }

        .badge-category {
            background: var(--light-grey);
            color: var(--text-medium);
        }

        .product-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.3;
            font-family: 'Poppins', sans-serif;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stars {
            display: flex;
            gap: 2px;
        }

        .stars i {
            color: #ffc107;
            font-size: 1rem;
        }

        .stars i.far {
            color: #ddd;
        }

        .rating-text {
            font-size: 0.95rem;
            color: var(--text-light);
        }

        .rating-text strong {
            color: var(--text-dark);
        }

        .product-pricing {
            display: flex;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
        }

        .current-price {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-dark);
            font-family: 'Poppins', sans-serif;
        }

        .original-price {
            font-size: 1.25rem;
            color: var(--text-light);
            text-decoration: line-through;
        }

        .discount-tag {
            padding: 6px 14px;
            background: linear-gradient(135deg, #ff5252 0%, #ff8a80 100%);
            color: #fff;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .product-description {
            font-size: 1rem;
            color: var(--text-medium);
            line-height: 1.8;
        }

        .product-meta {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            background: var(--light-grey);
            border-radius: var(--radius-md);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
        }

        .meta-item i {
            width: 20px;
            color: var(--blue-primary);
        }

        .meta-item.in-stock {
            color: #00c853;
        }

        .meta-item.out-of-stock {
            color: #ff5252;
        }

        .seller-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--light-grey);
            border-radius: var(--radius-md);
        }

        .seller-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--gradient-premium);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .seller-info h4 {
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .seller-info h4 .verified {
            color: #00c853;
            font-size: 0.9rem;
        }

        .seller-info p {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        /* Action Buttons */
        .product-actions {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }

        .btn-add-to-cart {
            flex: 2;
            padding: 16px 32px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--gradient-premium);
            color: var(--white);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition-normal);
        }

        .btn-add-to-cart:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 102, 255, 0.35);
        }

        .btn-add-to-cart.disabled {
            background: var(--light-grey);
            color: var(--text-light);
            cursor: not-allowed;
        }

        .btn-wishlist {
            width: 56px;
            height: 56px;
            border: 2px solid var(--light-grey);
            background: var(--white);
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
            color: var(--text-medium);
            font-size: 1.3rem;
        }

        .btn-wishlist:hover,
        .btn-wishlist.active {
            background: #ffe6e6;
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        /* Loading State */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 0;
            gap: 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--light-grey);
            border-top-color: var(--blue-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 80px 0;
        }

        .error-icon {
            font-size: 4rem;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .error-state h2 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .error-state p {
            color: var(--text-medium);
            margin-bottom: 24px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--gradient-premium);
            color: white;
            text-decoration: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            transition: var(--transition-fast);
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
        }

        /* Notification Toast */
        .notification-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--primary-black);
            color: white;
            padding: 16px 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: var(--transition-normal);
        }

        .notification-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .notification-toast.success {
            background: #00c853;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .product-layout {
                grid-template-columns: 1fr;
                gap: 32px;
                padding: 24px;
            }

            .product-title {
                font-size: 1.5rem;
            }

            .current-price {
                font-size: 2rem;
            }

            .product-actions {
                flex-direction: column;
            }

            .btn-wishlist {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            .header-content {
                padding: 12px 0;
            }

            .logo-text {
                display: none;
            }

            .product-page {
                padding: 24px 0 60px;
            }

            .product-layout {
                padding: 16px;
                border-radius: var(--radius-lg);
            }

            .thumbnail {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">
                    <div class="logo-icon">
                        <img src="/Logo/69shopc.png" alt="69Shop.in Logo">
                    </div>
                    <div class="logo-text">
                        <div class="site-name">69SHOP.IN</div>
                        <div class="tagline">Premium Marketplace</div>
                    </div>
                </a>
                <div class="header-actions">
                    <a href="/shop.html" class="header-btn">
                        <i class="fas fa-store"></i>
                        <span>Shop</span>
                    </a>
                    <button class="header-btn cart-btn" onclick="window.location.href='/shop.html'">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count" id="cartCount">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <nav class="breadcrumb-nav">
                <a href="/">Home</a>
                <i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i>
                <a href="/shop.html">Shop</a>
                <i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i>
                <span id="breadcrumbProduct">Product</span>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <main class="product-page">
        <div class="container">
            <!-- Loading State -->
            <div class="loading-state" id="loadingState">
                <div class="loading-spinner"></div>
                <p>Loading product...</p>
            </div>

            <!-- Error State -->
            <div class="error-state" id="errorState" style="display: none;">
                <div class="error-icon"><i class="fas fa-box-open"></i></div>
                <h2>Product Not Found</h2>
                <p>The product you're looking for doesn't exist or has been removed.</p>
                <a href="/shop.html" class="btn-back">
                    <i class="fas fa-arrow-left"></i>
                    Back to Shop
                </a>
            </div>

            <!-- Product Layout -->
            <div class="product-layout" id="productLayout" style="display: none;">
                <!-- Gallery -->
                <div class="product-gallery">
                    <div class="main-image-container">
                        <img src="" alt="" class="main-image" id="mainImage">
                        <div class="image-zoom-hint">
                            <i class="fas fa-search-plus"></i>
                            Hover to zoom
                        </div>
                    </div>
                    <div class="thumbnail-strip" id="thumbnailStrip"></div>
                </div>

                <!-- Info -->
                <div class="product-info">
                    <div class="product-badges" id="productBadges"></div>
                    <h1 class="product-title" id="productTitle"></h1>
                    <div class="product-rating" id="productRating"></div>
                    <div class="product-pricing" id="productPricing"></div>
                    <p class="product-description" id="productDescription"></p>
                    <div class="product-meta" id="productMeta"></div>
                    <div class="seller-card" id="sellerCard"></div>
                    <div class="product-actions" id="productActions"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Notification Toast -->
    <div class="notification-toast" id="notificationToast">
        <i class="fas fa-check-circle"></i>
        <span id="notificationMessage">Added to cart!</span>
    </div>

    <script>
        let currentProduct = null;
        let cart = [];
        let wishlist = new Set();

        // Load cart from storage
        function loadCart() {
            try {
                const savedCart = localStorage.getItem('69shop_cart');
                if (savedCart) {
                    cart = JSON.parse(savedCart);
                    updateCartCount();
                }
            } catch (e) {
                console.error('Error loading cart:', e);
            }
        }

        function loadWishlist() {
            try {
                const saved = localStorage.getItem('69shop_wishlist');
                if (saved) {
                    wishlist = new Set(JSON.parse(saved));
                }
            } catch (e) {
                console.error('Error loading wishlist:', e);
            }
        }

        function saveCart() {
            localStorage.setItem('69shop_cart', JSON.stringify(cart));
        }

        function saveWishlist() {
            localStorage.setItem('69shop_wishlist', JSON.stringify([...wishlist]));
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        function showNotification(message, type = 'success') {
            const toast = document.getElementById('notificationToast');
            const msgEl = document.getElementById('notificationMessage');
            msgEl.textContent = message;
            toast.className = `notification-toast show ${type}`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.5;
            const emptyStars = 5 - fullStars - (hasHalf ? 1 : 0);
            return `
                ${'<i class="fas fa-star"></i>'.repeat(fullStars)}
                ${hasHalf ? '<i class="fas fa-star-half-alt"></i>' : ''}
                ${'<i class="far fa-star"></i>'.repeat(emptyStars)}
            `;
        }

        function getProductImages(product) {
            if (product.images && Array.isArray(product.images) && product.images.length > 0) {
                return product.images;
            }
            return product.image ? [product.image] : ['/Logo/placeholder.png'];
        }

        function setMainImage(src) {
            document.getElementById('mainImage').src = src;
            document.querySelectorAll('.thumbnail').forEach(t => {
                t.classList.toggle('active', t.src === src);
            });
        }

        function addToCart() {
            if (!currentProduct) return;
            
            const existingItem = cart.find(item => item.id === currentProduct.id);
            const stock = currentProduct.stock ?? currentProduct.quantity ?? 10;
            
            if (existingItem) {
                if (existingItem.quantity < stock) {
                    existingItem.quantity++;
                } else {
                    showNotification('Maximum stock reached!', '');
                    return;
                }
            } else {
                cart.push({
                    id: currentProduct.id,
                    name: currentProduct.name,
                    price: currentProduct.price,
                    image: getProductImages(currentProduct)[0],
                    quantity: 1,
                    maxQuantity: stock
                });
            }
            
            saveCart();
            updateCartCount();
            showNotification(`${currentProduct.name} added to cart!`);
        }

        function toggleWishlist() {
            if (!currentProduct) return;
            
            const btn = document.querySelector('.btn-wishlist');
            if (wishlist.has(currentProduct.id)) {
                wishlist.delete(currentProduct.id);
                btn.classList.remove('active');
                btn.innerHTML = '<i class="far fa-heart"></i>';
                showNotification('Removed from wishlist', '');
            } else {
                wishlist.add(currentProduct.id);
                btn.classList.add('active');
                btn.innerHTML = '<i class="fas fa-heart"></i>';
                showNotification('Added to wishlist!');
            }
            saveWishlist();
        }

        function renderProduct(product) {
            currentProduct = product;
            const images = getProductImages(product);
            const isNew = product.createdAt && new Date(product.createdAt) > new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const isPremium = product.sellerType === 'premium';
            const isVerified = product.isVerified || product.verified;
            const discount = product.originalPrice ? Math.round((1 - product.price / product.originalPrice) * 100) : 0;
            const inStock = (product.stock ?? product.quantity ?? 1) > 0;
            const inWishlist = wishlist.has(product.id);

            // Update page title
            document.title = `${product.name} - 69Shop.in`;
            document.getElementById('breadcrumbProduct').textContent = product.name;

            // Main image
            document.getElementById('mainImage').src = images[0];
            document.getElementById('mainImage').alt = product.name;

            // Thumbnails
            const thumbnailStrip = document.getElementById('thumbnailStrip');
            thumbnailStrip.innerHTML = images.map((img, i) => `
                <img src="${img}" alt="Thumbnail ${i+1}" class="thumbnail ${i === 0 ? 'active' : ''}" 
                     onclick="setMainImage('${img}')" onerror="this.src='/Logo/placeholder.png'">
            `).join('');

            // Badges
            document.getElementById('productBadges').innerHTML = `
                <span class="badge badge-category">${product.category || 'General'}</span>
                ${isNew ? '<span class="badge badge-new">NEW</span>' : ''}
                ${discount > 0 ? `<span class="badge badge-discount">-${discount}% OFF</span>` : ''}
                ${isPremium ? '<span class="badge badge-premium"><i class="fas fa-crown"></i> Premium</span>' : ''}
            `;

            // Title
            document.getElementById('productTitle').textContent = product.name;

            // Rating
            document.getElementById('productRating').innerHTML = `
                <div class="stars">${renderStars(product.rating || 0)}</div>
                <span class="rating-text"><strong>${product.rating || 0}</strong> (${product.reviewCount || 0} reviews)</span>
            `;

            // Pricing
            document.getElementById('productPricing').innerHTML = `
                <span class="current-price">₹${product.price?.toLocaleString() || '0'}</span>
                ${product.originalPrice ? `<span class="original-price">₹${product.originalPrice.toLocaleString()}</span>` : ''}
                ${discount > 0 ? `<span class="discount-tag">${discount}% OFF</span>` : ''}
            `;

            // Description
            document.getElementById('productDescription').textContent = product.description || 'No description available.';

            // Meta
            document.getElementById('productMeta').innerHTML = `
                <div class="meta-item ${inStock ? 'in-stock' : 'out-of-stock'}">
                    <i class="fas ${inStock ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                    <span>${inStock ? `In Stock (${product.stock ?? product.quantity ?? 'Available'} units)` : 'Out of Stock'}</span>
                </div>
                <div class="meta-item">
                    <i class="fas fa-truck"></i>
                    <span>Free delivery on orders above ₹499</span>
                </div>
                <div class="meta-item">
                    <i class="fas fa-undo"></i>
                    <span>Easy 7-day returns</span>
                </div>
            `;

            // Seller card
            const sellerName = product.seller || product.sellerName || 'Shop';
            document.getElementById('sellerCard').innerHTML = `
                <div class="seller-avatar">${sellerName.charAt(0).toUpperCase()}</div>
                <div class="seller-info">
                    <h4>
                        ${sellerName}
                        ${isVerified ? '<i class="fas fa-check-circle verified"></i>' : ''}
                    </h4>
                    <p>Trusted seller on 69Shop.in</p>
                </div>
            `;

            // Actions
            document.getElementById('productActions').innerHTML = `
                <button class="btn-add-to-cart ${!inStock ? 'disabled' : ''}" onclick="addToCart()" ${!inStock ? 'disabled' : ''}>
                    <i class="fas fa-shopping-bag"></i>
                    ${inStock ? 'Add to Cart' : 'Notify When Available'}
                </button>
                <button class="btn-wishlist ${inWishlist ? 'active' : ''}" onclick="toggleWishlist()">
                    <i class="fa${inWishlist ? 's' : 'r'} fa-heart"></i>
                </button>
            `;

            // Show product layout
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('productLayout').style.display = 'grid';
        }

        function showError() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
        }

        async function loadProduct() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                showError();
                return;
            }

            try {
                // Try to load from Firestore first
                if (db) {
                    const doc = await db.collection('products').doc(productId).get();
                    if (doc.exists) {
                        renderProduct({ id: doc.id, ...doc.data() });
                        return;
                    }
                }

                // Fallback to local products data
                if (window.productsData && Array.isArray(window.productsData)) {
                    const product = window.productsData.find(p => p.id === productId);
                    if (product) {
                        renderProduct(product);
                        return;
                    }
                }

                showError();
            } catch (error) {
                console.error('Error loading product:', error);
                showError();
            }
        }

        // Initialize
        loadCart();
        loadWishlist();
        loadProduct();
    </script>
</body>
</html>
